# Generate the Xcode project with: xcodegen generate
name: XadrezNoOuvido
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  XadrezNoOuvido:
    type: application
    platform: iOS
    sources:
      - path: XadrezNoOuvido
      # Web app shared with the browser version (board, Stockfish, speech text)
      - path: ../app/index.html
        buildPhase: resources
      - path: ../app/stockfish.js
        buildPhase: resources
      - path: ../app/chess.min.js
        buildPhase: resources
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xadreznoouvido   # change to something unique to you
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/XadrezNoOuvido.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Only needed without Developer Mode in the Meta AI app (values from the Wearables Developer Center)
        META_APP_ID: ""
        CLIENT_TOKEN: ""
